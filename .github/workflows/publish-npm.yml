name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-sportwizzard-mcp
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0

      - name: Validate package and unused version
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          repository_url="$(node -p "require('./package.json').repository.url")"
          [[ "$package_name" == "sportwizzard-mcp" ]] || { echo 'Unexpected package name' >&2; exit 1; }
          [[ "$repository_url" == "git+https://github.com/adamruehle/sportwizzard-mcp.git" ]] || { echo 'Unexpected npm repository URL' >&2; exit 1; }
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid package version' >&2; exit 1; }
          error_file="$RUNNER_TEMP/npm-view-error.txt"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>"$error_file"; then
            echo "${package_name}@${package_version} already exists on npm" >&2
            exit 1
          else
            result=$?
            if ! grep -Eq 'E404|ETARGET' "$error_file"; then
              cat "$error_file" >&2
              exit "$result"
            fi
          fi
          printf 'Publishing %s@%s from %s\n' "$package_name" "$package_version" "$GITHUB_SHA"

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Preview npm package contents
        run: npm pack --dry-run

      - name: Publish with npm trusted publishing
        run: npm publish
